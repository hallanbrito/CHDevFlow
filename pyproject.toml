[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chdevflow"
version = "0.1.0.dev0"
description = "CHDevFlow CLI — governança universal, execução especializada (Método C.H.)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Hallan de Sousa Brito", email = "hallanbrito@users.noreply.github.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: OS Independent",
]
dependencies = [
    "ch-sentinela>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
ch = "chdevflow.cli:main"
chdevflow = "chdevflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
chdevflow = [
    "templates/*",
    "templates/**/*",
    "templates/**/.*",
    "templates/**/.github/**/*",
    "templates/**/.github/**/.*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ch-sentinela = { path = "apps/bootstrap/sentinela" }
