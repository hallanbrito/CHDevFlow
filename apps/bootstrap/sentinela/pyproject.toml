[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ch-sentinela"
version = "0.1.0"
description = "Sentinela Python do CHDevFlow Bootstrap Engine — Observação e supervisão segura de missões"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Product Owner Hallan", email = "hallanbrito@users.noreply.github.com" },
    { name = "Google Antigravity App v2.24.0" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.scripts]
ch-sentinela = "ch_sentinela.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
