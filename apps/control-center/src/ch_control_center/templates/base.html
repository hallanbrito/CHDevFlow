<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CHDevFlow Control Center{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="/static/js/app.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Menu Lateral (Sidebar) -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <div>
          <h1>Control Center</h1>
        </div>
        <span class="badge">v0.2</span>
      </div>

      <ul class="sidebar-menu">
        <li class="sidebar-menu-item">
          <a href="/" class="sidebar-menu-link {% if active_page == 'dashboard' %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
            Dashboard
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="/missoes" class="sidebar-menu-link {% if active_page == 'missoes' %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            Missões (Fatias W)
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="/grafo" class="sidebar-menu-link {% if active_page == 'grafo' %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            Grafo DAG
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="/estudante" class="sidebar-menu-link {% if active_page == 'estudante' %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            Modo Estudante
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div><strong>PO:</strong> Hallan</div>
        <div><strong>Host:</strong> CachyOS (Linux)</div>
        <div style="margin-top: 0.25rem;"><strong>Decisão D06:</strong> Custo R$ 0,00</div>
      </div>
    </aside>

    <!-- Área Principal -->
    <div class="main-wrapper">
      <header class="top-header">
        <div class="header-left">
          <span class="page-title">{% block page_title %}Visão Geral{% endblock %}</span>
        </div>

        <div class="header-right">
          <!-- Seletor de Perfil de Projeto (AUD-03 e AUD-02.1) -->
          <form action="/projetos/alternar" method="POST" style="display: inline-flex; align-items: center; gap: 0.4rem;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="select-projeto" style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">PROJETO:</label>
            <select id="select-projeto" name="project_key" onchange="this.form.submit()" style="padding: 0.35rem 0.6rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); font-size: 0.8rem; font-weight: 600; cursor: pointer;">
              <option value="chdevflow" selected>CHDevFlow (Meta-Governança)</option>
              <option value="hallancraft" disabled title="Perfil preparatório: Ingestão de dados de jogo reservada para fases futuras (AUD-03)">HallanCraft (PREPARATÓRIO — SEM TROCA DE DADOS)</option>
            </select>
          </form>

          <!-- Banner do Modo de Operação com Alternância (AUD-02.1) -->
          <form action="/demo/alternar" method="POST" style="display: inline-flex;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            {% if modo_operacao == 'DEMO_OFFLINE' %}
              <button type="submit" class="mode-banner demo btn-sm" title="Clique para alternar para modo ao vivo" style="border: none; cursor: pointer;">
                <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #f59e0b;"></span>
                MODO DEMO OFFLINE
              </button>
            {% else %}
              <button type="submit" class="mode-banner live btn-sm" title="Clique para alternar para demonstração offline" style="border: none; cursor: pointer;">
                <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #10b981;"></span>
                AO VIVO (GITHUB)
              </button>
            {% endif %}
          </form>

          <!-- Alternar Tema Escuro/Claro -->
          <button type="button" class="btn btn-sm" onclick="alternarTema()" title="Alternar Modo Escuro / Claro">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="content-area">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
</body>
</html>
