name: "Fatia W — Método C.H."
description: "Crie uma tarefa verificável com escopo e evidências."
title: "W-XX — "
body:
  - type: markdown
    attributes:
      value: "Não insira segredos, tokens ou dados pessoais nos relatórios."
  - type: input
    id: objetivo
    attributes:
      label: Objetivo e valor
      placeholder: "Qual resultado verificável será entregue?"
    validations:
      required: true
  - type: dropdown
    id: esteira
    attributes:
      label: Esteira
      options:
        - Hallan
        - ChatGPT
        - Codex
        - AGY
    validations:
      required: true
  - type: dropdown
    id: autonomia
    attributes:
      label: Nível de autonomia
      options:
        - CH-0
        - CH-1
        - CH-2
        - CH-3
    validations:
      required: true
  - type: textarea
    id: escopo
    attributes:
      label: Escopo, exclusões e critérios de aceite
    validations:
      required: true
  - type: input
    id: baseline
    attributes:
      label: Baseline Git (branch e SHA)
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Verificações e evidências exigidas
    validations:
      required: true
