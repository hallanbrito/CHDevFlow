name: F7 E3-C0 - Consume pinned attested executor (lab only)

"on":
  push:
    branches:
      - feat/ch-pipe-01-f7-e3c0-consumer-20261116

permissions:
  contents: read

concurrency:
  group: f7-e3c0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consume:
    if: >-
      github.repository == 'hallanbrito/CHDevFlow' &&
      github.ref == 'refs/heads/feat/ch-pipe-01-f7-e3c0-consumer-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout exact consumer SHA without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read-only download of E3-B artifact from exact run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p dist
          gh run download 43887485901 -R hallanbrito/CHDevFlow \
            --name f7-e3b-executor-389bcc61342cbcdd3183e291a18eef42ad78f488 \
            --dir dist
          sha256sum --check dist/f7-e3b-executor.tar.sha256
          echo 'b7b912afad6422f134501fd997eb13cc1bf70de8aa88de43e0988841a84b0242  dist/f7-e3b-executor.tar' | sha256sum --check
          test "$(cat dist/f7-e3b-image-id.txt)" = "sha256:e0c1bddedb8763803370d0a02b9d05371a30d9c4c82f0fe0b8813bb3b5b9f7ed"
      - name: Verify original Sigstore provenance for exact E3-B source commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify dist/f7-e3b-executor.tar \
            -R hallanbrito/CHDevFlow \
            --signer-workflow hallanbrito/CHDevFlow/.github/workflows/f7-e3b-executor-attest.yml \
            --source-digest 389bcc61342cbcdd3183e291a18eef42ad78f488 \
            --source-ref refs/heads/feat/ch-pipe-01-f7-e3b-attested-executor-20261116 \
            --deny-self-hosted-runners
          echo E3C0_PINNED_SIGSTORE_TAR_VERIFIED
      - name: Consume independently attested Docker image in isolated lab
        shell: bash
        run: |
          set -euo pipefail
          docker load -i dist/f7-e3b-executor.tar
          IMAGE="chdevflow-f7-e3b:389bcc61342cbcdd3183e291a18eef42ad78f488"
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = \
            "sha256:e0c1bddedb8763803370d0a02b9d05371a30d9c4c82f0fe0b8813bb3b5b9f7ed"
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "65534:65534"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            "389bcc61342cbcdd3183e291a18eef42ad78f488"
          FLAGS=(--rm --pull=never --network=none --read-only
            --cap-drop=ALL --security-opt=no-new-privileges
            --pids-limit=64 --memory=256m --cpus=1 --user=65534:65534
            --tmpfs=/tmp:rw,nosuid,nodev,noexec,size=32m)
          docker run "${FLAGS[@]}" "$IMAGE" --self-check | tee dist/self.json
          docker run "${FLAGS[@]}" \
            --mount "type=bind,source=$PWD/scripts/f7_e3b_fixtures/pass,target=/work,readonly" \
            --workdir=/work "$IMAGE" --run-tests | tee dist/pass.json
          set +e
          docker run "${FLAGS[@]}" \
            --mount "type=bind,source=$PWD/scripts/f7_e3b_fixtures/fail,target=/work,readonly" \
            --workdir=/work "$IMAGE" --run-tests > dist/fail.json
          FAIL_CODE=$?
          set -e
          test "$FAIL_CODE" -eq 12
          python scripts/f7_e3c0_manifest.py emit \
            --root dist --consumer-sha "$GITHUB_SHA" --consumer-run "$GITHUB_RUN_ID"
          echo E3C0_PINNED_EXECUTOR_REAL_POSITIVE_NEGATIVE
      - name: Attest the actual E3-C0 consumer manifest with GitHub OIDC
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/e3c0-manifest.json
          create-storage-record: false
      - name: Preserve evidence for separate verifier job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f7-e3c0-consumer-${{ github.sha }}
          path: dist/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  verify:
    needs: consume
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: f7-e3c0-consumer-${{ github.sha }}
          path: dist/
      - name: Verify original TAR and new manifest Sigstore statements
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check dist/f7-e3b-executor.tar.sha256
          echo 'b7b912afad6422f134501fd997eb13cc1bf70de8aa88de43e0988841a84b0242  dist/f7-e3b-executor.tar' | sha256sum --check
          gh attestation verify dist/f7-e3b-executor.tar \
            -R hallanbrito/CHDevFlow \
            --signer-workflow hallanbrito/CHDevFlow/.github/workflows/f7-e3b-executor-attest.yml \
            --source-digest 389bcc61342cbcdd3183e291a18eef42ad78f488 \
            --source-ref refs/heads/feat/ch-pipe-01-f7-e3b-attested-executor-20261116 \
            --deny-self-hosted-runners
          gh attestation verify dist/e3c0-manifest.json \
            -R hallanbrito/CHDevFlow \
            --signer-workflow hallanbrito/CHDevFlow/.github/workflows/f7-e3c0-consume-attested-executor.yml \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners
          python scripts/f7_e3c0_manifest.py verify \
            --root dist --consumer-sha "$GITHUB_SHA" --consumer-run "$GITHUB_RUN_ID"
          cp dist/e3c0-manifest.json "$RUNNER_TEMP/forged-manifest.json"
          printf 'forged\n' >> "$RUNNER_TEMP/forged-manifest.json"
          if gh attestation verify "$RUNNER_TEMP/forged-manifest.json" \
              -R hallanbrito/CHDevFlow \
              --signer-workflow hallanbrito/CHDevFlow/.github/workflows/f7-e3c0-consume-attested-executor.yml \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners; then
            echo 'E3C0_TAMPER_ACCEPTED: SECURITY FAILURE'
            exit 1
          fi
          echo E3C0_INDEPENDENT_SIGSTORE_CHAIN_VERIFIED
