name: F7 - Custodia protegida do atestador

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: ID do run protegido do produtor F7
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  CH_F7_TRUSTED_RUNNER_SHA: ${{ vars.CH_F7_TRUSTED_RUNNER_SHA }}
  CH_F7_TRUSTED_RUNNER_PUBKEY: ${{ vars.CH_F7_TRUSTED_RUNNER_PUBKEY }}
  CH_F7_PRODUCER_WORKFLOW_ID: ${{ vars.CH_F7_PRODUCER_WORKFLOW_ID }}
  CH_F7_REVOKED_RUNNER_FINGERPRINTS: ${{ vars.CH_F7_REVOKED_RUNNER_FINGERPRINTS }}
  CH_F7_ATTESTOR_SHA: ${{ vars.CH_F7_ATTESTOR_SHA }}
  PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}

jobs:
  sign:
    if: >-
      github.repository == 'hallanbrito/CHDevFlow' &&
      github.ref == 'refs/heads/main' &&
      github.sha == vars.CH_F7_ATTESTOR_SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: f7-attestor
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validar a origem e assinar dentro da custodia
        env:
          GH_TOKEN: ${{ github.token }}
          CH_F7_SIGNING_KEY: ${{ secrets.CH_F7_SIGNING_KEY }}
        run: python scripts/f7_custody_live.py sign "$PRODUCER_RUN_ID" "$RUNNER_TEMP/f7-public"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f7-custody-public-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f7-public
          if-no-files-found: error
          retention-days: 30
  verify:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: f7-custody-public-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f7-public
      - name: Verificar o recibo e a origem em outro runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/f7_custody_live.py verify "$PRODUCER_RUN_ID" "$RUNNER_TEMP/f7-public"
