name: F7 V1 Attestor - protected origin admission only (BLOCKED)

"on":
  workflow_run:
    workflows:
      - "F7 V1 Producer - explicit mission admission only (BLOCKED)"
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: f7-v1-attestor-singleton
  cancel-in-progress: false

jobs:
  v1-attestor-origin-only:
    if: >-
      github.repository == 'hallanbrito/CHDevFlow' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.CH_F7_V1_ATTESTOR_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Nao alegar protecao ativa: environment precisa de criacao,
    # aprovadores e regras PO antes de qualquer ativacao.
    environment: f7-attestor
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact protected main SHA with no persisted GitHub token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify live producer identity and refuse unsigned mission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -I scripts/f7_v1_attestor_preflight.py
          echo "E3C5_UNEXPECTED_V1_ATTESTATION_ADMISSION"
          exit 42
