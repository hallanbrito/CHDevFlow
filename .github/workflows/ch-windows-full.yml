name: CH-WIN-01 Windows Testes Completos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-integral:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar pacotes e dependencias de teste
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./apps/bootstrap/sentinela
          python -m pip install -e "./apps/control-center[dev]"
          python -m pip install -e ".[dev]"

      - name: Testes Windows reais - tres suites, sem mascarar falhas
        shell: pwsh
        run: |
          $failed = $false
          python -m compileall -q src scripts apps
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          python -m unittest discover -s apps/bootstrap/sentinela/tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          python -m pytest apps/control-center/tests -v
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          if ($failed) {
            Write-Error "CH-WIN-01: ao menos uma suite Windows falhou; nao homologar."
            exit 1
          }
          Write-Output "CH-WIN-01: todas as suites Windows passaram."
